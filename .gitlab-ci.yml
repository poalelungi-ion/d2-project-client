stages: [quality]

.mr_only: &mr_only
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.node_cache: &node_cache
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]

duplication:
  <<: *mr_only
  stage: quality
  image: node:22-alpine
  <<: *node_cache
  script:
    - npx jscpd@5 ./src
  artifacts:
    when: always
    reports:
      codequality: report/gl-code-quality-report.json
    paths: [report/]

complexity:
  <<: *mr_only
  stage: quality
  image: node:22-alpine
  <<: *node_cache
  script:
    - npm ci --cache .npm --prefer-offline
    - npx eslint --format gitlab src/ || true
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json