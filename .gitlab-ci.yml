stages: [quality]

.quality_base: &quality_base
  stage: quality
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

duplication:
  <<: *quality_base
  script:
    - npx jscpd@5 ./src --reporters console,html,codeclimate,json
  artifacts:
    when: always
    paths: [report/]
    reports:
      codequality: report/gl-code-quality-report.json

complexity:
  <<: *quality_base
  variables:
    ESLINT_CODE_QUALITY_REPORT: gl-code-quality-report.json
  script:
    - npm ci --cache .npm --prefer-offline
    # Prints every finding to the job log and writes the code quality report.
    - npx eslint --config eslint.config.ci.js src/ --format gitlab || true
    # Console summary: violations per rule, hotspot files, per-finding details.
    - node scripts/complexity-summary.mjs "$ESLINT_CODE_QUALITY_REPORT"
  artifacts:
    when: always
    paths: [gl-code-quality-report.json]
    reports:
      codequality: gl-code-quality-report.json
