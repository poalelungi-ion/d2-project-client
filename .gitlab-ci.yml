stages: [quality, e2e, publish]

.quality_base: &quality_base
  stage: quality
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

duplication:
  <<: *quality_base
  script:
    - npx jscpd@5 . --reporters console,html,codeclimate,json
  artifacts:
    when: always
    paths: [report/]
    reports:
      codequality: report/gl-code-quality-report.json

complexity:
  <<: *quality_base
  variables:
    ESLINT_CODE_QUALITY_REPORT: gl-code-quality-report.json
  script:
    - npm ci --cache .npm --prefer-offline
    # Prints every finding to the job log and writes the code quality report.
    # `|| true` so pre-existing lint errors don't abort the job here; the
    # summary below decides the exit code.
    - npx eslint --config eslint.config.ci.js src/ --format gitlab || true
    # Console summary, and the gate: fails the job on complexity violations only.
    - node scripts/complexity-summary.mjs "$ESLINT_CODE_QUALITY_REPORT"
  artifacts:
    when: always
    paths: [gl-code-quality-report.json]
    reports:
      codequality: gl-code-quality-report.json

unit_tests:
  <<: *quality_base
  variables:
    # Floor, not a target. Raise it as tests land so coverage can only ratchet up.
    COVERAGE_FLOOR: "2"
  script:
    - npm ci --cache .npm --prefer-offline
    # `|| true` so failing tests still reach the summary below, which decides
    # the exit code and prints the pass/fail and coverage tables.
    - npm run test:ci || true
    - npm run test:summary
  coverage: '/Total coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    paths: [coverage/, junit.xml]
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

require_approval:
  stage: quality
  image: alpine:3.20
  # Merge request pipelines only: there is nothing to approve on a branch build.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    REQUIRED_APPROVALS: "1"
  before_script:
    - apk add --no-cache curl jq
  script:
    - sh scripts/require-approval.sh

# End-to-end suite: a real browser against the built client, the published
# backend image and a real PostgreSQL. 
#
# A merge request is tested against the backend's :main image, not its own:
# this repository holds only the client. A backend change is therefore covered
# once it lands on main, not while it is in review.
e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    DATABASE_URL: "sqlite:////tmp/e2e.db"
    JWT_SECRET: ci-only-not-a-real-secret
    SEED_ON_STARTUP: "false"
    COOKIE_SECURE: "false"

    E2E_API_TARGET: http://api:8000
    BACKEND_IMAGE: "$CI_REGISTRY/sudarshan.bashyal/d2-project-backend:main"
  services:
    # Published by the backend repository's publish_image job.
    - name: "$BACKEND_IMAGE"
      alias: api
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build:e2e
    # `|| true` so a failing run still reaches the summary below, which prints
    # the table and decides the exit code -- same shape as unit_tests above.
    - npx playwright test || true
    - npm run test:e2e:summary
  artifacts:
    when: always
    # Traces and videos are large, and this is a shared instance.
    expire_in: 1 week
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: e2e-junit.xml

# Publishes the production image (nginx serving the built bundle) 
# Dockerfile's default target. Publishes the commit tag, which a deployment can
# pin to, alongside the ref slug (":main" here). 
publish_image:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    # The image's own entrypoint is the executor; clear it so GitLab can run
    # the script below in a shell.
    entrypoint: [""]
  # Default branch only: an image per MR would fill the registry. Scheduled
  # pipelines also run on main, but only to run e2e -- they must not publish.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # Skip downloading earlier jobs' artifacts (Playwright traces, reports): they
  # would only land in the build context.
  dependencies: []
  before_script:
    # Kaniko reads registry credentials from this file rather than `docker
    # login`. CI_REGISTRY_USER / _PASSWORD are injected by GitLab and scoped to
    # this project's registry for the length of the job.
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
  script:
    # --cache pushes intermediate layers to a side repository, so the npm ci
    # in the Dockerfile is reused until package-lock.json changes.
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
        --destination "$CI_REGISTRY_IMAGE:latest"
        --cache=true
        --cache-repo "$CI_REGISTRY_IMAGE/cache"
    - echo "Published $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA, :$CI_COMMIT_REF_SLUG and :latest"
