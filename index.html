<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPA - Professional Grade</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <style>
      body, html { 
        margin: 0; padding: 0; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        /* Professional Grey Background */
        background: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 100%);
        background-color: #f5f5f5;
        background-attachment: fixed;
      }
      #root { display: flex; height: 100vh; flex-direction: column; }
      
      /* Make AG Grid blend elegantly into the professional theme */
      .ag-theme-alpine {
        --ag-background-color: rgba(255, 255, 255, 0.8);
        --ag-header-background-color: rgba(245, 245, 245, 0.9);
        --ag-odd-row-background-color: rgba(250, 250, 250, 0.8);
        --ag-border-color: rgba(0, 0, 0, 0.1);
        --ag-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
