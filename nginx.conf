# Serves the Vite build as a single-page app.
server {
    listen      5173;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # The app has no server-side routes: anything else falls back to the
    # entry document, which must never be cached or clients pin an old bundle.
    location / {
        add_header Cache-Control "no-cache";
        try_files  $uri $uri/ /index.html;
    }
}
