# Stack for running the end-to-end suite on a laptop. The CI job builds the
# same shape out of GitLab `services:`, pulling a published backend image
# instead of building one.
#
#   docker compose -f docker-compose.e2e.yml up -d --build
#   npm run test:e2e
#   docker compose -f docker-compose.e2e.yml down -v
#
# `down -v` drops the volume, which is how a run starts from an empty schema.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: spa_user
      POSTGRES_PASSWORD: spa_password
      POSTGRES_DB: spa_e2e
    # Not published: only the backend talks to it, and leaving the port closed
    # avoids clashing with a development database already running on 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa_user -d spa_e2e"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    # The sibling repository, so the suite can run against uncommitted backend
    # changes. CI pulls the registry image built by the backend's publish job.
    build: ../d2-project-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://spa_user:spa_password@db/spa_e2e
      JWT_SECRET: e2e-only-not-a-real-secret
      # Demo seeding is off: src/database/seed.py draws grades from an unseeded
      # random, so no figure it produces is stable enough to assert on. Specs
      # create whatever they need instead.
      SEED_ON_STARTUP: "false"
      # The browser reaches the API through the preview server's /api proxy, so
      # requests are same-origin and this is only a fallback for direct calls.
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
